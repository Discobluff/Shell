variables:
  BUILD: "false"

default:
  image: gibson-registry.telecomnancy.univ-lorraine.fr/projets/2526/systeme/projet/projet-systeme-groupe-30

stages:
  - image-build
  - compilation
  - tests_generic
  - tests_custom

build:
  stage: image-build
  rules:
    - if: $BUILD == "true"
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}"

compile:  
  stage: compilation
  rules:
    - if: $BUILD == "false"  
  script:
    - make all
  artifacts:
    paths:
      - main

myps:
  stage: tests_custom
  rules:
    - if: $BUILD == "false"
  script:
    - ./main
    - myps
