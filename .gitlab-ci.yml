variables:
  BUILD: "false"

default:
  image: gibson-registry.telecomnancy.univ-lorraine.fr/projets/2526/systeme/projet/projet-systeme-groupe-30

stages:
  - image-build
  - compilation
  - tests_generic
  - tests_custom_without_args
  - tests_custom_with_args

build:
  stage: image-build
  rules:
    - if: $BUILD == "true"
  image:
    name: gcr.io/kaniko-project/executor:v1.24.0-debug
    entrypoint: [""]
  script:
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}"

compile:  
  stage: compilation
  rules:
    - if: $BUILD == "false"  
  script:
    - make all
  artifacts:
    paths:
      - main

.template_custom_without_args:
  stage: tests_custom_without_args
  rules:
    - if: '$BUILD == "false"'
  script:
    - echo "$CMD" | make run

.template_custom_with_args:
  stage: tests_custom_with_args
  rules:
    - if: '$BUILD == "false"'
  script:
    - echo "$CMD" | make run

myps:
  extends: .template_custom_without_args
  variables:
    CMD: "myps"

mypstree:
  extends: .template_custom_without_args
  variables:
    CMD: "mypstree"

mynetstat:
  extends: .template_custom_without_args
  variables:
    CMD: "mynetstat"

myarp:
  extends: .template_custom_without_args
  variables:
    CMD: "myarp"

myenv:
  extends: .template_custom_with_args
  variables:
    CMD: "myenv -p 1"

.template_generic:
  stage: tests_generic
  rules:
    - if: '$BUILD == "false"'
  script:
    - make run <<< "$CMD"

ls:
  extends: .template_generic
  variables:
    CMD: "ls"

test1:
  extends: .template_generic
  variables:
    CMD: "echo bonjour > test.txt\nls\ncat test.txt\n rm test.txt"
  
test2:
  extends: .template_generic
  variables:
    CMD: "echo test.txt > test.txt \ncat test.txt | xargs rm"

test;:
  extends: .template_generic
  variables:
    CMD: "ls ; echo bonjour"

test&&||:
  extends: .template_generic
  variables:
    CMD: "ls||ls;ls&&ls;lsd||ls;lsd&&ls;ls||lsd;ls&&lsd"

test~:
  extends: .template_generic
  variables:
    CMD: "cd ; pwd ; cd .. ; cd ~ ; pwd"

cd:
  extends: .template_generic
  variables:
    CMD: "cd src \npwd"
